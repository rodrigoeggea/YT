<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Music & Video Finder</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-header: rgba(15, 15, 15, 0.94);
      --bg-card: #181818;
      --bg-card-hover: #222222;
      --border-color: #2b2b2b;
      --border-focus: #ff0000;
      --text-primary: #f1f1f1;
      --text-secondary: #aaaaaa;
      --text-muted: #717171;
      --accent-red: #ff0000;
      --accent-red-hover: #cc0000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: #282828;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3e3e3e;
    }

    /* Header & Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.5rem;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-red);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(255, 0, 0, 0.35);
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
      margin-left: 2px;
    }

    .brand-accent {
      color: var(--accent-red);
    }

    /* Search Bar Form */
    .search-form {
      flex: 1;
      max-width: 620px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: #121212;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 0.95rem;
      border-radius: 9999px;
      padding: 0.65rem 2.8rem 0.65rem 1.25rem;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: rgba(255, 0, 0, 0.85);
      box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.15);
      background: #161616;
    }

    .search-input::placeholder {
      color: #666666;
    }

    .clear-btn {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      font-size: 0.85rem;
      line-height: 1;
      display: none;
      border-radius: 50%;
    }

    .clear-btn:hover {
      color: var(--text-primary);
    }

    .search-submit-btn {
      margin-left: 0.6rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.65rem 1.2rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .search-submit-btn:hover {
      background: #252525;
      border-color: #404040;
    }

    .search-submit-btn:active {
      transform: scale(0.97);
    }

    .badge-info {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    @media (min-width: 900px) {
      .badge-info {
        display: flex;
      }
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    /* Status & Subheader Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .status-title {
      font-weight: 600;
      color: var(--text-primary);
    }

    .status-query {
      color: var(--accent-red);
      font-style: italic;
    }

    /* Video Results Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    @media (min-width: 1200px) {
      .video-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Video Card Component */
    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: #444444;
      background: var(--bg-card-hover);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      background: #111111;
      overflow: hidden;
    }

    .thumbnail-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .video-card:hover .thumbnail-img {
      transform: scale(1.05);
    }

    .card-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .video-card:hover .card-play-overlay {
      opacity: 1;
    }

    .play-icon-badge {
      width: 48px;
      height: 48px;
      background: var(--accent-red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }

    .video-card:hover .play-icon-badge {
      transform: scale(1);
    }

    .play-icon-badge svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      margin-left: 2px;
    }

    .external-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      color: #eaeaea;
      font-size: 0.68rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      pointer-events: none;
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .video-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 0.45rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text-primary);
      transition: color 0.15s ease;
    }

    .video-card:hover .video-title {
      color: #ff4d4d;
    }

    .channel-title {
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.75rem;
    }

    .card-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Loading State Spinner */
    .state-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4.5rem 1rem;
      text-align: center;
      flex: 1;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .state-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
    }

    .state-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.45;
    }

    /* Error and Retry Box */
    .error-card {
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 2rem;
      border-radius: 12px;
      max-width: 520px;
    }

    .error-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 1rem;
      color: #ef4444;
    }

    .retry-btn {
      margin-top: 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.6rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover {
      background: #272727;
      border-color: #555555;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- Top Sticky Header -->
  <header>
    <div class="header-inner">
      <!-- App Brand -->
      <div class="brand" onclick="handleBrandClick()">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <span>Sound<span class="brand-accent">Finder</span></span>
      </div>

      <!-- Search Input Form -->
      <form class="search-form" id="search-form" onsubmit="event.preventDefault(); onFormSubmit();">
        <div class="search-input-wrapper">
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Pesquisar no YouTube..." 
            autocomplete="off" 
            autocapitalize="none"
            spellcheck="false"
          />
          <button 
            type="button" 
            id="clear-btn" 
            class="clear-btn" 
            onclick="clearSearchInput()" 
            aria-label="Limpar texto"
          >
            &#x2715;
          </button>
        </div>
        <button type="submit" class="search-submit-btn" aria-label="Pesquisar">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
      </form>

      <!-- Badge Indication -->
      <div class="badge-info">
        <span class="badge-dot"></span>
        <span>Abre direto no YouTube</span>
      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main>
    <!-- Dynamic Status Header -->
    <div id="status-bar" class="status-bar hidden">
      <div>
        <span class="status-title">Resultados da pesquisa:</span>
        <span id="status-query" class="status-query"></span>
      </div>
      <span id="status-count"></span>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="state-container hidden">
      <div class="spinner"></div>
      <p class="state-title">Buscando músicas e vídeos...</p>
      <p class="state-desc">Consultando a YouTube Data API v3.</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="state-container hidden">
      <div class="error-card">
        <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <h3 class="state-title" id="error-title">Falha na Busca</h3>
        <p class="state-desc" id="error-desc">Não foi possível carregar os vídeos.</p>
        <button class="retry-btn" onclick="retryLastSearch()">Tentar Novamente</button>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="state-container hidden">
      <h3 class="state-title">Nenhum resultado encontrado</h3>
      <p class="state-desc" id="empty-desc">Tente utilizar outros termos na barra de pesquisa.</p>
    </div>

    <!-- Video Results Grid -->
    <div id="video-grid" class="video-grid hidden"></div>
  </main>

  <script>
    // Configuration
    const API_KEY = "AIzaSyConJE6iVJJ3pz-ag1xxJZfAN2VG0aOz40";
    const API_SEARCH_ENDPOINT = "https://www.googleapis.com/youtube/v3/search";
    const INITIAL_SEARCH_QUERY = "melhores musicas 2026";

    // DOM Elements
    const searchInput = document.getElementById("search-input");
    const clearBtn = document.getElementById("clear-btn");
    const videoGrid = document.getElementById("video-grid");
    const statusBar = document.getElementById("status-bar");
    const statusQuery = document.getElementById("status-query");
    const statusCount = document.getElementById("status-count");
    const loadingState = document.getElementById("loading-state");
    const errorState = document.getElementById("error-state");
    const errorTitle = document.getElementById("error-title");
    const errorDesc = document.getElementById("error-desc");
    const emptyState = document.getElementById("empty-state");
    const emptyDesc = document.getElementById("empty-desc");

    let lastExecutedQuery = INITIAL_SEARCH_QUERY;

    // Helper: Escape HTML to avoid injection
    function escapeHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Helper: Format ISO Publication Date
    function formatDate(dateStr) {
      if (!dateStr) return "";
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString("pt-BR", {
          day: "2-digit",
          month: "short",
          year: "numeric"
        });
      } catch (e) {
        return "";
      }
    }

    // UI Input Management
    searchInput.addEventListener("input", () => {
      clearBtn.style.display = searchInput.value.trim().length > 0 ? "block" : "none";
    });

    function clearSearchInput() {
      searchInput.value = "";
      clearBtn.style.display = "none";
      searchInput.focus();
    }

    function handleBrandClick() {
      clearSearchInput();
      fetchYouTubeVideos(INITIAL_SEARCH_QUERY, "Destaques: Melhores Músicas 2026");
    }

    function onFormSubmit() {
      const query = searchInput.value.trim();
      if (!query) return;
      fetchYouTubeVideos(query, `"${query}"`);
    }

    function retryLastSearch() {
      fetchYouTubeVideos(lastExecutedQuery, `"${lastExecutedQuery}"`);
    }

    async function fetchYouTubeVideos(query, displayLabel) {
      lastExecutedQuery = query;

      // Update UI to Loading
      videoGrid.classList.add("hidden");
      statusBar.classList.add("hidden");
      emptyState.classList.add("hidden");
      errorState.classList.add("hidden");
      loadingState.classList.remove("hidden");

      try {
        const params = new URLSearchParams({
          part: "snippet",
          type: "video",
          maxResults: "16",
          q: query,
          key: API_KEY
        });

        const response = await fetch(`${API_SEARCH_ENDPOINT}?${params.toString()}`);
        const data = await response.json();

        if (!response.ok) {
          const apiMsg = data && data.error && data.error.message ? data.error.message : `Status HTTP: ${response.status}`;
          throw new Error(apiMsg);
        }

        renderVideos(data.items || [], displayLabel || query);
      } catch (err) {
        showError(err.message);
      } finally {
        loadingState.classList.add("hidden");
      }
    }

    function renderVideos(videos, displayLabel) {
      videoGrid.innerHTML = "";

      if (!videos || videos.length === 0) {
        emptyDesc.textContent = `Nenhum vídeo retornado para a busca solicitada. Tente novos termos.`;
        emptyState.classList.remove("hidden");
        return;
      }

      // Update Status Header
      statusQuery.textContent = displayLabel;
      statusCount.textContent = `${videos.length} vídeos`;
      statusBar.classList.remove("hidden");

      videos.forEach((item) => {
        const videoId = item.id.videoId;
        if (!videoId) return;

        const snippet = item.snippet;
        const title = snippet.title;
        const channel = snippet.channelTitle;
        const published = formatDate(snippet.publishedAt);
        const thumbUrl = snippet.thumbnails?.high?.url || snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url;
        const youtubeUrl = `https://www.youtube.com/watch?v=${videoId}`;

        // Create direct external card link
        const card = document.createElement("a");
        card.href = youtubeUrl;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.className = "video-card";
        card.setAttribute("aria-label", `Assistir ${escapeHtml(title)} no YouTube`);

        card.innerHTML = `
          <div class="thumbnail-container">
            <img 
              class="thumbnail-img" 
              src="${thumbUrl}" 
              alt="${escapeHtml(title)}"
              loading="lazy"
              onerror="this.src='https://placehold.co/480x360/1a1a1a/aaaaaa?text=Sem+Thumbnail'"
            />
            <div class="card-play-overlay">
              <div class="play-icon-badge">
                <svg viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
            </div>
            <div class="external-badge">
              <span>YouTube</span>
              <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
              </svg>
            </div>
          </div>
          <div class="card-content">
            <div>
              <h3 class="video-title" title="${escapeHtml(title)}">${escapeHtml(title)}</h3>
              <p class="channel-title" title="${escapeHtml(channel)}">${escapeHtml(channel)}</p>
            </div>
            <div class="card-footer">
              <span>Data de publicação</span>
              <span>${published}</span>
            </div>
          </div>
        `;

        videoGrid.appendChild(card);
      });

      videoGrid.classList.remove("hidden");
    }

    // Display error message
    function showError(message) {
      errorTitle.textContent = "Erro na Consulta ao YouTube";
      errorDesc.textContent = message || "Ocorreu uma falha ao tentar comunicar-se com a API.";
      errorState.classList.remove("hidden");
    }

    window.addEventListener("DOMContentLoaded", () => {
      // 1. Keep search input strictly empty
      searchInput.value = "";
      clearBtn.style.display = "none";

      // 2. Automatically focus the search input for immediate user typing
      searchInput.focus();

      // 3. Automatically perform initial search in background and render videos below
      fetchYouTubeVideos(INITIAL_SEARCH_QUERY, "Melhores Músicas 2026");
    });
  </script>
</body>
</html>
