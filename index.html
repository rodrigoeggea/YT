<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTAuto</title>
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-surface: #1f1f1f;
      --bg-surface-hover: #272727;
      --border-color: #303030;
      --text-main: #f1f1f1;
      --text-muted: #aaaaaa;
      --accent: #ff0000;
      --accent-hover: #cc0000;
      --key-bg: #2b2b2b;
      --key-hover: #3d3d3d;
      --key-active: #4a4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand-icon {
      color: var(--accent);
      display: flex;
      align-items: center;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 640px;
      margin: 0 auto;
    }

    .search-box {
      display: flex;
      align-items: center;
      background-color: #121212;
      border: 1px solid var(--border-color);
      border-radius: 40px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: #3ea6ff;
      box-shadow: 0 0 0 1px #3ea6ff;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 10px 18px;
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      background: var(--bg-surface);
      border: none;
      border-left: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .search-btn:hover {
      background-color: var(--bg-surface-hover);
    }

    .search-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Teclado Virtual Dropdown */
    .virtual-keyboard {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 200;
      animation: fadeInDown 0.18s ease-out;
    }

    .virtual-keyboard.active {
      display: flex;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .keyboard-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .key {
      flex: 1;
      height: 42px;
      background-color: var(--key-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.1s, transform 0.05s;
    }

    .key:hover {
      background-color: var(--key-hover);
    }

    .key:active {
      background-color: var(--key-active);
      transform: scale(0.97);
    }

    .key-special {
      background-color: #222222;
      color: #dddddd;
      font-size: 0.85rem;
    }

    .key-space {
      flex: 3.5;
    }

    .key-backspace, .key-shift, .key-clear {
      flex: 1.4;
    }

    .key-search {
      flex: 1.8;
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    .key-search:hover {
      background-color: var(--accent-hover);
    }

    main {
      flex: 1;
      padding: 24px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .status-msg {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px 16px;
    }

    .video-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      overflow: hidden;
      background-color: var(--bg-surface);
      border: 1px solid transparent;
      transition: transform 0.18s, border-color 0.18s, background-color 0.18s;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-color);
      background-color: var(--bg-surface-hover);
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background-color: #000;
    }

    .thumbnail-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text-main);
    }

    .video-channel {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    @media (max-width: 600px) {
      header {
        padding: 10px 14px;
        flex-direction: column;
        align-items: stretch;
      }
      .brand {
        justify-content: center;
      }
      main {
        padding: 14px;
      }
      .key {
        height: 38px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand" onclick="location.reload(); return false;">
      <span class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
        </svg>
      </span>
      YTAuto
    </a>

    <div class="search-wrapper" id="search-wrapper">
      <form class="search-box" id="search-form" onsubmit="event.preventDefault(); triggerSearch();">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Pesquisar no YouTube..." 
          autocomplete="off"
          inputmode="none"
          readonly
        />
        <button type="submit" class="search-btn" title="Buscar" id="search-submit-btn">
          <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </form>

      <!-- Teclado Virtual Dropdown -->
      <div class="virtual-keyboard" id="virtual-keyboard">
        <div class="keyboard-row">
          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2</button>
          <button type="button" class="key" data-key="3">3</button>
          <button type="button" class="key" data-key="4">4</button>
          <button type="button" class="key" data-key="5">5</button>
          <button type="button" class="key" data-key="6">6</button>
          <button type="button" class="key" data-key="7">7</button>
          <button type="button" class="key" data-key="8">8</button>
          <button type="button" class="key" data-key="9">9</button>
          <button type="button" class="key" data-key="0">0</button>
        </div>
        <div class="keyboard-row">
          <button type="button" class="key" data-key="q">q</button>
          <button type="button" class="key" data-key="w">w</button>
          <button type="button" class="key" data-key="e">e</button>
          <button type="button" class="key" data-key="r">r</button>
          <button type="button" class="key" data-key="t">t</button>
          <button type="button" class="key" data-key="y">y</button>
          <button type="button" class="key" data-key="u">u</button>
          <button type="button" class="key" data-key="i">i</button>
          <button type="button" class="key" data-key="o">o</button>
          <button type="button" class="key" data-key="p">p</button>
        </div>
        <div class="keyboard-row">
          <button type="button" class="key" data-key="a">a</button>
          <button type="button" class="key" data-key="s">s</button>
          <button type="button" class="key" data-key="d">d</button>
          <button type="button" class="key" data-key="f">f</button>
          <button type="button" class="key" data-key="g">g</button>
          <button type="button" class="key" data-key="h">h</button>
          <button type="button" class="key" data-key="j">j</button>
          <button type="button" class="key" data-key="k">k</button>
          <button type="button" class="key" data-key="l">l</button>
          <button type="button" class="key" data-key="ç">ç</button>
        </div>
        <div class="keyboard-row">
          <button type="button" class="key key-special key-shift" id="key-shift">Shift</button>
          <button type="button" class="key" data-key="z">z</button>
          <button type="button" class="key" data-key="x">x</button>
          <button type="button" class="key" data-key="c">c</button>
          <button type="button" class="key" data-key="v">v</button>
          <button type="button" class="key" data-key="b">b</button>
          <button type="button" class="key" data-key="n">n</button>
          <button type="button" class="key" data-key="m">m</button>
          <button type="button" class="key key-special key-backspace" id="key-backspace">&#x232B;</button>
        </div>
        <div class="keyboard-row">
          <button type="button" class="key key-special key-clear" id="key-clear">Limpar</button>
          <button type="button" class="key key-space" data-key=" ">Espaço</button>
          <button type="button" class="key key-search" id="key-search">Pesquisar</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="status-container"></div>
    <div class="video-grid" id="video-grid"></div>
  </main>

  <script>
    const API_KEY = "AIzaSyConJE6iVJJ3pz-ag1xxJZfAN2VG0aOz40";
    const INITIAL_SEARCH = "melhores musicas 2026";

    const searchInput = document.getElementById("search-input");
    const virtualKeyboard = document.getElementById("virtual-keyboard");
    const searchWrapper = document.getElementById("search-wrapper");
    const shiftBtn = document.getElementById("key-shift");
    const backspaceBtn = document.getElementById("key-backspace");
    const clearBtn = document.getElementById("key-clear");
    const searchKeyBtn = document.getElementById("key-search");
    const videoGrid = document.getElementById("video-grid");
    const statusContainer = document.getElementById("status-container");

    let isShiftActive = false;

    // Abrir o teclado virtual ao clicar/tocar no input
    function openKeyboard() {
      virtualKeyboard.classList.add("active");
    }

    function closeKeyboard() {
      virtualKeyboard.classList.remove("active");
    }

    searchInput.addEventListener("click", openKeyboard);
    searchInput.addEventListener("focus", openKeyboard);
    searchInput.addEventListener("touchstart", (e) => {
      openKeyboard();
    });

    // Fechar ao clicar fora
    document.addEventListener("click", (e) => {
      if (!searchWrapper.contains(e.target)) {
        closeKeyboard();
      }
    });

    // Digitação pelas teclas
    document.querySelectorAll(".key[data-key]").forEach(keyEl => {
      keyEl.addEventListener("click", (e) => {
        e.preventDefault();
        let char = keyEl.getAttribute("data-key");
        if (isShiftActive && char.length === 1) {
          char = char.toUpperCase();
        }
        searchInput.value += char;
      });
    });

    // Shift / Caps
    shiftBtn.addEventListener("click", (e) => {
      e.preventDefault();
      isShiftActive = !isShiftActive;
      shiftBtn.style.backgroundColor = isShiftActive ? "var(--accent)" : "";
      document.querySelectorAll(".key[data-key]").forEach(keyEl => {
        const char = keyEl.getAttribute("data-key");
        if (char !== " ") {
          keyEl.textContent = isShiftActive ? char.toUpperCase() : char.toLowerCase();
        }
      });
    });

    // Apagar (Backspace)
    backspaceBtn.addEventListener("click", (e) => {
      e.preventDefault();
      searchInput.value = searchInput.value.slice(0, -1);
    });

    // Limpar tudo
    clearBtn.addEventListener("click", (e) => {
      e.preventDefault();
      searchInput.value = "";
    });

    // Executar busca
    function triggerSearch() {
      closeKeyboard();
      const query = searchInput.value.trim();
      if (query) {
        fetchVideos(query);
      }
    }

    searchKeyBtn.addEventListener("click", (e) => {
      e.preventDefault();
      triggerSearch();
    });

    // Busca na API do YouTube
    async function fetchVideos(query) {
      statusContainer.innerHTML = '<div class="spinner"></div><div class="status-msg">Carregando vídeos...</div>';
      videoGrid.innerHTML = "";

      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=16&q=${encodeURIComponent(query)}&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          statusContainer.innerHTML = `<div class="status-msg" style="color: #ff6b6b;">Erro: ${data.error.message}</div>`;
          return;
        }

        if (!data.items || data.items.length === 0) {
          statusContainer.innerHTML = '<div class="status-msg">Nenhum resultado encontrado.</div>';
          return;
        }

        statusContainer.innerHTML = "";
        renderVideos(data.items);
      } catch (err) {
        statusContainer.innerHTML = '<div class="status-msg" style="color: #ff6b6b;">Erro de rede ao conectar à API do YouTube.</div>';
      }
    }

    function renderVideos(items) {
      videoGrid.innerHTML = "";
      items.forEach(item => {
        const videoId = item.id.videoId;
        const { title, channelTitle, thumbnails } = item.snippet;
        const thumbUrl = thumbnails.medium ? thumbnails.medium.url : thumbnails.default.url;

        const card = document.createElement("a");
        card.className = "video-card";
        card.href = `https://www.youtube.com/watch?v=${videoId}`;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="${thumbUrl}" alt="${title}" loading="lazy">
          </div>
          <div class="video-info">
            <div class="video-title" title="${title}">${title}</div>
            <div class="video-channel">${channelTitle}</div>
          </div>
        `;

        videoGrid.appendChild(card);
      });
    }

    // Ao iniciar: carrega as músicas iniciais mantendo o input limpo
    window.addEventListener("DOMContentLoaded", () => {
      fetchVideos(INITIAL_SEARCH);
    });
  </script>
</body>
</html>
