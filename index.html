<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTAuto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a
        href="#"
        class="brand"
        onclick="
          location.reload();
          return false;
        "
      >
        <span class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"
            />
          </svg>
        </span>
        <div class="brand-text">
          YTAuto
          <span class="version">2610172054</span>
        </div>
      </a>

      <div class="search-wrapper" id="search-wrapper">
        <!-- Elemento visual não editável pelo SO para impedir qualquer teclado nativo -->
        <div class="search-box" id="search-box">
          <div class="search-display" id="search-display">
            <span class="placeholder" id="search-placeholder"
              >Pesquisar no YouTube...</span
            >
            <span class="text-content" id="search-text"></span>
            <span class="virtual-cursor" id="virtual-cursor"></span>
          </div>
          <button
            type="button"
            class="clear-btn"
            title="Fechar Teclado"
            id="clear-search-btn"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              />
            </svg>
          </button>
        </div>

        <div class="virtual-keyboard" id="virtual-keyboard">
          <div class="keyboard-row">
            <button type="button" class="key" data-key="1">1</button>
            <button type="button" class="key" data-key="2">2</button>
            <button type="button" class="key" data-key="3">3</button>
            <button type="button" class="key" data-key="4">4</button>
            <button type="button" class="key" data-key="5">5</button>
            <button type="button" class="key" data-key="6">6</button>
            <button type="button" class="key" data-key="7">7</button>
            <button type="button" class="key" data-key="8">8</button>
            <button type="button" class="key" data-key="9">9</button>
            <button type="button" class="key" data-key="0">0</button>
          </div>
          <div class="keyboard-row">
            <button type="button" class="key" data-key="q">q</button>
            <button type="button" class="key" data-key="w">w</button>
            <button type="button" class="key" data-key="e">e</button>
            <button type="button" class="key" data-key="r">r</button>
            <button type="button" class="key" data-key="t">t</button>
            <button type="button" class="key" data-key="y">y</button>
            <button type="button" class="key" data-key="u">u</button>
            <button type="button" class="key" data-key="i">i</button>
            <button type="button" class="key" data-key="o">o</button>
            <button type="button" class="key" data-key="p">p</button>
          </div>
          <div class="keyboard-row">
            <button type="button" class="key" data-key="a">a</button>
            <button type="button" class="key" data-key="s">s</button>
            <button type="button" class="key" data-key="d">d</button>
            <button type="button" class="key" data-key="f">f</button>
            <button type="button" class="key" data-key="g">g</button>
            <button type="button" class="key" data-key="h">h</button>
            <button type="button" class="key" data-key="j">j</button>
            <button type="button" class="key" data-key="k">k</button>
            <button type="button" class="key" data-key="l">l</button>
            <button type="button" class="key" data-key="ç">ç</button>
          </div>
          <div class="keyboard-row">
            <button
              type="button"
              class="key key-special key-shift"
              id="key-shift"
            >
              Shift
            </button>
            <button type="button" class="key" data-key="z">z</button>
            <button type="button" class="key" data-key="x">x</button>
            <button type="button" class="key" data-key="c">c</button>
            <button type="button" class="key" data-key="v">v</button>
            <button type="button" class="key" data-key="b">b</button>
            <button type="button" class="key" data-key="n">n</button>
            <button type="button" class="key" data-key="m">m</button>
            <button
              type="button"
              class="key key-special key-backspace"
              id="key-backspace"
            >
              &#x232B;
            </button>
          </div>
          <div class="keyboard-row">
            <button
              type="button"
              class="key key-special key-clear"
              id="key-clear"
            >
              Limpar
            </button>
            <button type="button" class="key key-space" data-key=" ">
              Espaço
            </button>
            <button type="button" class="key key-search" id="key-search">
              Pesquisar
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="status-container"></div>
      <div class="video-grid" id="video-grid"></div>
    </main>

    <script>
      const API_KEY = "AIzaSyConJE6iVJJ3pz-ag1xxJZfAN2VG0aOz40";
      const INITIAL_SEARCH = "melhores musicas 2026";

      // Elementos da interface
      const searchWrapper = document.getElementById("search-wrapper");
      const searchBox = document.getElementById("search-box");
      const searchDisplay = document.getElementById("search-display");
      const searchPlaceholder = document.getElementById("search-placeholder");
      const searchText = document.getElementById("search-text");
      const clearSearchBtn = document.getElementById("clear-search-btn");

      const virtualKeyboard = document.getElementById("virtual-keyboard");
      const shiftBtn = document.getElementById("key-shift");
      const backspaceBtn = document.getElementById("key-backspace");
      const clearBtn = document.getElementById("key-clear");
      const searchKeyBtn = document.getElementById("key-search");

      const videoGrid = document.getElementById("video-grid");
      const statusContainer = document.getElementById("status-container");

      let currentQuery = "";
      let isShiftActive = false;

      // Atualiza a exibição visual do texto e placeholder
      function updateDisplay() {
        if (currentQuery.length === 0) {
          searchPlaceholder.style.display = "inline";
          searchText.textContent = "";
        } else {
          searchPlaceholder.style.display = "none";
          searchText.textContent = currentQuery;
        }
        searchDisplay.scrollLeft = searchDisplay.scrollWidth;
      }

      // Controle de abertura e fechamento do teclado virtual
      function openKeyboard() {
        virtualKeyboard.classList.add("active");
        searchBox.classList.add("is-active");
      }

      function closeKeyboard() {
        virtualKeyboard.classList.remove("active");
        searchBox.classList.remove("is-active");
      }

      // Clique ou toque na caixa de texto abre apenas o teclado virtual
      searchDisplay.addEventListener("click", (e) => {
        e.stopPropagation();
        openKeyboard();
      });

      searchDisplay.addEventListener(
        "touchstart",
        (e) => {
          e.stopPropagation();
          openKeyboard();
        },
        { passive: true },
      );

      // Fechar ao clicar fora do wrapper de busca
      document.addEventListener("click", (e) => {
        if (!searchWrapper.contains(e.target)) {
          closeKeyboard();
        }
      });

      // Inserção de caracteres
      document.querySelectorAll(".key[data-key]").forEach((keyEl) => {
        keyEl.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          let char = keyEl.getAttribute("data-key");
          if (isShiftActive && char.length === 1) {
            char = char.toUpperCase();
          }
          currentQuery += char;
          updateDisplay();
        });
      });

      // Shift / Caps toggle
      shiftBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        isShiftActive = !isShiftActive;
        shiftBtn.style.backgroundColor = isShiftActive ? "var(--accent)" : "";
        document.querySelectorAll(".key[data-key]").forEach((keyEl) => {
          const char = keyEl.getAttribute("data-key");
          if (char !== " ") {
            keyEl.textContent = isShiftActive
              ? char.toUpperCase()
              : char.toLowerCase();
          }
        });
      });

      // Apagar (Backspace)
      backspaceBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (currentQuery.length > 0) {
          currentQuery = currentQuery.slice(0, -1);
          updateDisplay();
        }
      });

      // Limpar tudo
      clearBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        currentQuery = "";
        updateDisplay();
      });

      // Executar busca
      function triggerSearch() {
        closeKeyboard();
        const query = currentQuery.trim();
        if (query) {
          fetchVideos(query);
        }
      }

      searchKeyBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        triggerSearch();
      });

      // Botão "X" para fechar/esconder o teclado virtual sem apagar o texto
      clearSearchBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeKeyboard();
      });

      // Suporte para tecla Enter física (se conectado a teclado físico ou volante)
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          triggerSearch();
        }
      });

      // Requisição à YouTube Data API v3
      async function fetchVideos(query) {
        statusContainer.innerHTML =
          '<div class="spinner"></div><div class="status-msg">Carregando vídeos...</div>';
        videoGrid.innerHTML = "";

        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=16&q=${encodeURIComponent(query)}&key=${API_KEY}`;

        try {
          const response = await fetch(url);
          const data = await response.json();

          if (data.error) {
            statusContainer.innerHTML = `<div class="status-msg" style="color: #ff6b6b;">Erro: ${data.error.message}</div>`;
            return;
          }

          statusContainer.innerHTML = "";
          renderVideos(data.items);
        } catch (err) {
          statusContainer.innerHTML =
            '<div class="status-msg" style="color: #ff6b6b;">Erro de rede ao conectar à API do YouTube.</div>';
        }
      }

      // Renderização dos cards de vídeo
      function renderVideos(items) {
        videoGrid.innerHTML = "";
        items.forEach((item) => {
          const videoId = item.id.videoId;
          const { title, channelTitle, thumbnails } = item.snippet;
          const thumbUrl = thumbnails.medium
            ? thumbnails.medium.url
            : thumbnails.default.url;

          const card = document.createElement("a");
          card.className = "video-card";
          card.href = `https://www.youtube.com/watch?v=${videoId}`;
          card.target = "";
          card.rel = "noopener noreferrer";

          card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="${thumbUrl}" alt="${title}" loading="lazy">
          </div>
          <div class="video-info">
            <div class="video-title" title="${title}">${title}</div>
            <div class="video-channel">${channelTitle}</div>
          </div>
        `;

          videoGrid.appendChild(card);
        });
      }

      // Inicialização com a busca padrão
      window.addEventListener("DOMContentLoaded", () => {
        fetchVideos(INITIAL_SEARCH);
      });
    </script>
  </body>
</html>
